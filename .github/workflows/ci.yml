# PR / main gate: build both image variants (slim, polyglot) and run their
# smokes — the offline contract smoke on each, plus the polyglot per-language
# build-and-test smoke (tests/polyglot/, needs network for the package managers),
# and the assertions that slim stays byte-identical (polyglot = slim + layers;
# on PRs, slim = the base branch's slim). No push — publishing happens via
# release.yml / publish.yml.
# PRs additionally get the version guard: a change to any image input MUST come
# with a VERSION bump (that bump is what releases it on merge — see release.yml),
# and a changed VERSION must not collide with an existing tag (which would merge
# and then release nothing).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  version-guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require a VERSION bump when image inputs change
        run: |
          set -euo pipefail
          # Image inputs = files that alter the built image (extend as the
          # build context grows). Deliberately NOT tests/, workflows, README —
          # those change the repo, not the image, and need no release. The
          # guard is one-directional: a VERSION-only PR stays legal (that is
          # how the unpinned agent CLIs get re-snapshotted).
          IMAGE_INPUTS='^(Dockerfile|entrypoint-stub\.sh)$'
          CHANGED="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")"
          echo "changed files:"; echo "$CHANGED"
          if echo "$CHANGED" | grep -qE "$IMAGE_INPUTS" \
              && ! echo "$CHANGED" | grep -qx "VERSION"; then
            echo "::error file=VERSION::Image inputs changed but VERSION was not bumped — bump VERSION so the change ships as a release on merge (release.yml)."
            exit 1
          fi
          if echo "$CHANGED" | grep -qx "VERSION"; then
            V="$(tr -d '[:space:]' < VERSION)"
            if git ls-remote --exit-code --tags origin "refs/tags/v$V" > /dev/null; then
              echo "::error file=VERSION::VERSION is $V but tag v$V already exists — this PR would merge without releasing anything. Bump to a new version."
              exit 1
            fi
          fi
          echo "version guard: OK"

  # Both variants in ONE job, slim first: the polyglot build then reuses slim's
  # layers from this builder's local cache (same SNAPSHOT_STAMP), so polyglot is
  # provably slim + toolchain layers. Separate GHA cache scopes per variant —
  # with one shared scope, each cache-to would overwrite the other's index.
  build-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The polyglot image (+ the builder's cache and the --load copy) does not
      # fit next to the runner's preinstalled SDKs; drop the ones never used here.
      - name: Free runner disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Build slim
        uses: docker/build-push-action@v6
        with:
          context: .
          target: slim
          # Busts the cache of the unpinned CLI install layers (see Dockerfile,
          # SNAPSHOT_STAMP): a release must re-snapshot, never reuse, those layers.
          build-args: |
            SNAPSHOT_STAMP=${{ github.run_id }}
          load: true
          tags: alissa-loopwork-base:ci
          cache-from: type=gha,scope=slim
          cache-to: type=gha,scope=slim,mode=max

      - name: Smoke test (slim — asserts no toolchains)
        run: >
          docker run --rm --entrypoint /bin/bash
          -e LOOPWORK_VARIANT=slim
          -v "$PWD/tests/smoke.sh:/smoke.sh:ro"
          alissa-loopwork-base:ci /smoke.sh

      - name: Build polyglot
        uses: docker/build-push-action@v6
        with:
          context: .
          target: polyglot
          build-args: |
            SNAPSHOT_STAMP=${{ github.run_id }}
          load: true
          tags: alissa-loopwork-base:ci-polyglot
          cache-from: |
            type=gha,scope=slim
            type=gha,scope=polyglot
          cache-to: type=gha,scope=polyglot,mode=max

      - name: Smoke test (polyglot — image contract + toolchains present)
        run: >
          docker run --rm --entrypoint /bin/bash
          -e LOOPWORK_VARIANT=polyglot
          -v "$PWD/tests/smoke.sh:/smoke.sh:ro"
          alissa-loopwork-base:ci-polyglot /smoke.sh

      - name: Polyglot build-and-test smoke (C, C++, Go, Rust, Kotlin/Java, Scala + Spark, Ruby, PHP, .NET, R)
        run: >
          docker run --rm --entrypoint /bin/bash
          -v "$PWD/tests/polyglot:/polyglot:ro"
          alissa-loopwork-base:ci-polyglot /polyglot/smoke.sh

      # The slim content must never move because of the polyglot variant.
      # (1) polyglot = slim + layers: its layer chain starts with slim's, so no
      # polyglot instruction rewrote a slim layer.
      - name: Assert polyglot = slim + layers
        run: |
          set -euo pipefail
          s="$(docker image inspect -f '{{json .RootFS.Layers}}' alissa-loopwork-base:ci)"
          p="$(docker image inspect -f '{{json .RootFS.Layers}}' alissa-loopwork-base:ci-polyglot)"
          jq -en --argjson s "$s" --argjson p "$p" \
              '($p | length) > ($s | length) and $p[:($s | length)] == $s' > /dev/null \
            || { echo "::error::the polyglot image's layer chain does not start with slim's"; exit 1; }
          echo "polyglot = slim ($(jq length <<<"$s") layers) + $(( $(jq length <<<"$p") - $(jq length <<<"$s") )) layers"

      # (2) On PRs: slim is byte-identical to the base branch's slim. The base
      # branch's Dockerfile is built in THIS builder with the same SNAPSHOT_STAMP,
      # so an unchanged base stage resolves to the very same cached layers (same
      # diff IDs = same bytes, the unpinned CLI layers included) and the same
      # runtime config. A PR that changes slim on purpose carries the
      # `slim-change` label, which skips this step.
      - name: Assert slim unchanged vs the base branch
        if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'slim-change')
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          git worktree add --detach "$RUNNER_TEMP/base-ref" FETCH_HEAD
          docker buildx build --target slim \
              --build-arg SNAPSHOT_STAMP=${{ github.run_id }} \
              --load -t alissa-loopwork-base:ci-base-ref "$RUNNER_TEMP/base-ref"
          shape() { # shape <image>: layer diff IDs + the runtime config the leaves inherit
            docker image inspect "$1" | jq -S '.[0] | {layers: .RootFS.Layers,
                config: (.Config | {Env, Entrypoint, Cmd, WorkingDir, User, ExposedPorts, Volumes})}'
          }
          if ! diff <(shape alissa-loopwork-base:ci-base-ref) <(shape alissa-loopwork-base:ci); then
            echo "::error::slim differs from ${{ github.base_ref }}'s slim (diff above: base branch < > this PR). If that is intended, label the PR slim-change."
            exit 1
          fi
          echo "slim unchanged vs ${{ github.base_ref }}: $(shape alissa-loopwork-base:ci | jq '.layers | length') identical layers, same config"

      # Informational: what each variant weighs. Uncompressed = docker's image
      # size; compressed ≈ gzip of `docker save` (the registry's exact number
      # is reported by publish.yml in the GitHub release notes).
      - name: Image sizes
        run: |
          set -euo pipefail
          {
            echo "| variant | uncompressed | compressed (≈) |"
            echo "|---|---|---|"
            for pair in slim:ci polyglot:ci-polyglot; do
              v="${pair%%:*}"; img="alissa-loopwork-base:${pair#*:}"
              raw="$(docker image inspect -f '{{.Size}}' "$img")"
              gz="$(docker save "$img" | gzip -6 | wc -c)"
              echo "| $v | $(numfmt --to=iec "$raw") | $(numfmt --to=iec "$gz") |"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"
