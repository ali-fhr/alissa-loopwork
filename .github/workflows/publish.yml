# Tag-driven publish to GHCR: pushing a git tag vX.Y.Z builds the image, runs
# the same smoke test as CI, and (only if it passes) pushes
#   ghcr.io/ali-fhr/alissa-loopwork-base:X.Y.Z  +  :X.Y  +  :X
# Auth is the workflow's own GITHUB_TOKEN (packages: write) — no extra secrets.
# metadata-action stamps the OCI labels (incl. org.opencontainers.image.source),
# which links the package to this repo in GHCR.
#
# One-time after the first publish: flip the package's visibility to PUBLIC in
# the org package settings — GHCR packages default to private, and the Railway
# builds pull this image anonymously (see README).
name: publish

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build once into the local docker store and gate the push on the smoke
      # test — a tag must never publish an image CI would have failed.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: alissa-loopwork-base:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: >
          docker run --rm --entrypoint /bin/bash
          -v "$PWD/tests/smoke.sh:/smoke.sh:ro"
          alissa-loopwork-base:smoke /smoke.sh

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/ali-fhr/alissa-loopwork-base
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
