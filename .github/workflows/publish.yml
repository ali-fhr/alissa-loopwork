# Publish to GHCR: builds BOTH variants, runs the same smokes as CI, and (only
# if every smoke passes) pushes
#   ghcr.io/ali-fhr/alissa-loopwork-base:X.Y.Z           +  :X.Y           +  :X
#   ghcr.io/ali-fhr/alissa-loopwork-base:X.Y.Z-polyglot  +  :X.Y-polyglot  +  :X-polyglot
# then writes the GitHub release vX.Y.Z with each variant's compressed size (as
# the registry reports it), the polyglot toolchain pins and its languages manifest.
# Auth is the workflow's own GITHUB_TOKEN (packages: write; contents: write for
# the release notes) — no extra secrets.
#
# Two ways in, one job:
#   * push of a git tag vX.Y.Z (the manual/backfill path), version = the tag
#   * workflow_call from release.yml (the VERSION-file auto path), version = the
#     input. This call exists because tags created with GITHUB_TOKEN do NOT
#     trigger other workflows (GitHub's recursion guard) — release.yml must
#     invoke publishing explicitly rather than rely on its tag push.
# Image tags are computed from the version in bash (metadata-action was dropped:
# it derives tags from the git ref, which on the workflow_call path is a branch,
# not the tag). OCI labels are set explicitly for the same reason — the source
# label is what links the package to this repo in GHCR.
name: publish

on:
  push:
    tags: ["v*.*.*"]
  workflow_call:
    inputs:
      version:
        description: "Semver to publish (no leading v), e.g. 0.2.0"
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # See ci.yml: the polyglot image does not fit next to the preinstalled SDKs.
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: docker/setup-buildx-action@v3

      # Build each variant once into the local docker store and gate the push on
      # the smokes — a release must never publish an image CI would have failed.
      # Slim first, polyglot second in the same builder: polyglot reuses slim's
      # freshly snapshotted layers (same SNAPSHOT_STAMP), so both tags of one
      # release carry the same agent CLIs. Cache scopes per variant (see ci.yml).
      - name: Build slim
        uses: docker/build-push-action@v6
        with:
          context: .
          target: slim
          # Busts the cache of the unpinned CLI install layers (see Dockerfile,
          # SNAPSHOT_STAMP): a release must re-snapshot, never reuse, those layers.
          build-args: |
            SNAPSHOT_STAMP=${{ github.run_id }}
          load: true
          tags: alissa-loopwork-base:smoke
          cache-from: type=gha,scope=slim
          cache-to: type=gha,scope=slim,mode=max

      - name: Smoke test (slim)
        run: >
          docker run --rm --entrypoint /bin/bash
          -e LOOPWORK_VARIANT=slim
          -v "$PWD/tests/smoke.sh:/smoke.sh:ro"
          alissa-loopwork-base:smoke /smoke.sh

      - name: Build polyglot
        uses: docker/build-push-action@v6
        with:
          context: .
          target: polyglot
          build-args: |
            SNAPSHOT_STAMP=${{ github.run_id }}
          load: true
          tags: alissa-loopwork-base:smoke-polyglot
          cache-from: |
            type=gha,scope=slim
            type=gha,scope=polyglot
          cache-to: type=gha,scope=polyglot,mode=max

      - name: Smoke test (polyglot)
        run: >
          docker run --rm --entrypoint /bin/bash
          -e LOOPWORK_VARIANT=polyglot
          -v "$PWD/tests/smoke.sh:/smoke.sh:ro"
          alissa-loopwork-base:smoke-polyglot /smoke.sh

      - name: Polyglot build-and-test smoke
        run: >
          docker run --rm --entrypoint /bin/bash
          -v "$PWD/tests/polyglot:/polyglot:ro"
          alissa-loopwork-base:smoke-polyglot /polyglot/smoke.sh

      # Same gate as ci.yml: polyglot is slim + layers, never a rewrite of slim.
      - name: Assert polyglot = slim + layers
        run: |
          set -euo pipefail
          s="$(docker image inspect -f '{{json .RootFS.Layers}}' alissa-loopwork-base:smoke)"
          p="$(docker image inspect -f '{{json .RootFS.Layers}}' alissa-loopwork-base:smoke-polyglot)"
          jq -en --argjson s "$s" --argjson p "$p" \
              '($p | length) > ($s | length) and $p[:($s | length)] == $s' > /dev/null \
            || { echo "::error::the polyglot image's layer chain does not start with slim's"; exit 1; }

      - name: Compute image tags
        id: ver
        run: |
          set -euo pipefail
          V="${{ inputs.version || github.ref_name }}"
          V="${V#v}"
          case "$V" in
            *.*.*) ;;
            *) echo "not a semver: $V" >&2; exit 1 ;;
          esac
          IMG=ghcr.io/ali-fhr/alissa-loopwork-base
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tags=$IMG:$V,$IMG:${V%.*},$IMG:${V%%.*}" >> "$GITHUB_OUTPUT"
          echo "polyglot_tags=$IMG:$V-polyglot,$IMG:${V%.*}-polyglot,$IMG:${V%%.*}-polyglot" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push slim
        uses: docker/build-push-action@v6
        with:
          context: .
          target: slim
          # Busts the cache of the unpinned CLI install layers (see Dockerfile,
          # SNAPSHOT_STAMP): a release must re-snapshot, never reuse, those layers.
          build-args: |
            SNAPSHOT_STAMP=${{ github.run_id }}
          push: true
          tags: ${{ steps.ver.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/ali-fhr/alissa-loopwork
            org.opencontainers.image.title=alissa-loopwork-base
            org.opencontainers.image.description=Shared runtime substrate for the Alissa loopwork daemon images
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=slim

      - name: Push polyglot
        uses: docker/build-push-action@v6
        with:
          context: .
          target: polyglot
          build-args: |
            SNAPSHOT_STAMP=${{ github.run_id }}
          push: true
          tags: ${{ steps.ver.outputs.polyglot_tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/ali-fhr/alissa-loopwork
            org.opencontainers.image.title=alissa-loopwork-base (polyglot)
            org.opencontainers.image.description=Loopwork base + C/C++, Go, Rust, Java/Kotlin, Ruby, PHP and .NET toolchains
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: |
            type=gha,scope=slim
            type=gha,scope=polyglot

      # Release notes: each variant's compressed size = the sum of its pushed
      # layer sizes (linux/amd64 manifest), i.e. what a pull downloads. Created
      # if absent, notes replaced if the release already exists (re-publish).
      - name: Release notes with variant sizes
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          IMG=ghcr.io/ali-fhr/alissa-loopwork-base
          size() { # size <ref>: compressed bytes of the linux/amd64 image
            local raw digest
            raw="$(docker buildx imagetools inspect --raw "$1")"
            digest="$(jq -r 'if .manifests then (.manifests[] | select(.platform.os=="linux" and .platform.architecture=="amd64") | .digest) else empty end' <<<"$raw" | head -1)"
            if [ -n "$digest" ]; then raw="$(docker buildx imagetools inspect --raw "${1%:*}@$digest")"; fi
            jq '[.layers[].size] | add' <<<"$raw"
          }
          arg() { sed -n "s/^ARG $1=//p" Dockerfile; }
          SLIM="$(size "$IMG:$V")"
          POLY="$(size "$IMG:$V-polyglot")"
          {
            echo "## Images"
            echo
            echo "| variant | tag | compressed (linux/amd64) |"
            echo "|---|---|---|"
            echo "| slim | \`$IMG:$V\` | $(numfmt --to=iec "$SLIM") |"
            echo "| polyglot | \`$IMG:$V-polyglot\` | $(numfmt --to=iec "$POLY") (+$(numfmt --to=iec $((POLY - SLIM))) over slim) |"
            echo
            echo "## Polyglot toolchains"
            echo
            echo "Go $(arg GO_VERSION) · Rust $(arg RUST_VERSION) (rustup $(arg RUSTUP_VERSION)) · Temurin JDK $(arg TEMURIN_VERSION) · Gradle $(arg GRADLE_VERSION) · Maven $(arg MAVEN_VERSION) · Ruby $(arg RUBY_VERSION) (+ Bundler) · PHP $(arg PHP_VERSION) (sury) + Composer $(arg COMPOSER_VERSION) · .NET SDK $(arg DOTNET_SDK_VERSION) · gcc/g++/make/cmake/pkg-config/gdb from Debian bookworm."
            echo
            echo "The exact toolchain versions are in the image's languages manifest, \`/usr/local/share/alissa/languages.json\`:"
            echo
            echo '```json'
            docker run --rm --entrypoint cat alissa-loopwork-base:smoke-polyglot /usr/local/share/alissa/languages.json
            echo '```'
            echo
            echo "Adopting the polyglot variant is an operator rollout decision: a leaf opts in by pinning the \`-polyglot\` tag (see README)."
          } > notes.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"
          if gh release view "v$V" > /dev/null 2>&1; then
            gh release edit "v$V" --notes-file notes.md
          else
            gh release create "v$V" --verify-tag --title "v$V" --notes-file notes.md
          fi
